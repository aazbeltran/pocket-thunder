name: Blue War Axolotl Build

on:
  push:
    branches: [main]
    paths:
      - 'blue-war-axolotl/**'
      - '.github/workflows/blue-war-axolotl.yml'
    tags:
      - 'bwa-v*'
  pull_request:
    paths:
      - 'blue-war-axolotl/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          echo "Validating all JSON files..."
          find blue-war-axolotl -name '*.json' -print0 | while IFS= read -r -d '' file; do
            echo "  Checking: $file"
            python3 -m json.tool "$file" > /dev/null
          done
          echo "All JSON files valid."

      - name: Build .mcaddon
        run: |
          cd blue-war-axolotl
          bash build.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blue_war_axolotl
          path: blue-war-axolotl/blue_war_axolotl.mcaddon

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/bwa-v')
        uses: softprops/action-gh-release@v2
        with:
          files: blue-war-axolotl/blue_war_axolotl.mcaddon
          generate_release_notes: true
