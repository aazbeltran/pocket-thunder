name: Blue War Axolotl Build

on:
  push:
    branches: [main]
    paths:
      - 'blue-war-axolotl/**'
      - '.github/workflows/blue-war-axolotl.yml'
  pull_request:
    paths:
      - 'blue-war-axolotl/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JSON files
        run: |
          echo "Validating all JSON files..."
          find blue-war-axolotl -name '*.json' -print0 | while IFS= read -r -d '' file; do
            echo "  Checking: $file"
            python3 -m json.tool "$file" > /dev/null
          done
          echo "All JSON files valid."

      - name: Build .mcaddon
        run: |
          cd blue-war-axolotl
          bash build.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blue_war_axolotl
          path: blue-war-axolotl/blue_war_axolotl.mcaddon

      - name: Detect existing release tags
        id: release_tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git tag -l 'bwa-v*' | grep -q .; then
            echo "has_tags=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tags=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set first release tag
        id: first_release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tags.outputs.has_tags == 'false'
        run: |
          echo "tag=bwa-v0.1.0" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_tags.outputs.has_tags == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.first_release.outputs.tag }}
          name: ${{ steps.first_release.outputs.tag }}
          generate_release_notes: true
          files: blue-war-axolotl/blue_war_axolotl.mcaddon
